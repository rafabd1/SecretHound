patterns:
    api_key_assignment:
        regex: (?i)(?:^|[^A-Za-z0-9_])['"]?(?:api[_.-]?(?:key|secret)|app[_.-]?(?:key|secret))['"]?\s*[:=]\s*(?:(?:process\.env|import\.meta\.env|deno\.env|config|settings|secrets?)\.[A-Za-z_][A-Za-z0-9_]*\s*(?:\|\||\?\?)\s*)?['"]?([A-Za-z0-9_.-]{16,64})(?:['"]|[\s,;}\]]|$)
        description: API Key Assignment
        enabled: true
        category: generic
        minlength: 16
        collisionpriority: -10
        contextpenaltyany:
            - example
            - sample
            - placeholder
            - test
            - your
            - xxx
        useentropy: true
        minentropy: 3.5
        entropyminlength: 16
    auth_token:
        regex: '[''"]?([a-zA-Z0-9_\-\.]{32,64})[''"]?\s*[,;]?\s*\/\/\s*[Aa]uth(?:entication)?\s+[Tt]oken'
        description: Authentication Token (Comment Based)
        enabled: true
        category: auth
        minlength: 32
        maxlength: 64
    aws_access_key:
        regex: \b((?:AKIA|ASIA)[0-9A-Z]{16})(?:[^A-Za-z0-9_]|$)
        description: AWS Access Key ID
        enabled: true
        category: aws
        minlength: 20
        maxlength: 20
        collisionpriority: 20
        contextboostany:
            - aws
            - amazon
            - access
            - key
    aws_secret_key:
        regex: (?i)(?:aws[_-]?secret[_-]?access[_-]?key|secret[_-]?access[_-]?key)\s*[:=]\s*['"]?([A-Za-z0-9/+=]{40})(?:['"]|[^A-Za-z0-9_./+=-]|$)
        description: AWS Secret Access Key
        enabled: true
        category: aws
        minlength: 40
        maxlength: 40
        collisionpriority: 20
        contextboostany:
            - aws
            - amazon
            - secret
    azure_connection_string:
        regex: DefaultEndpointsProtocol=https;AccountName=[^;]{1,256};AccountKey=[^;]{1,1000};EndpointSuffix=
        description: Azure Storage Connection String
        enabled: true
        category: azure
        minlength: 70
        maxlength: 2048
    azure_cosmosdb:
        regex: AccountEndpoint=https:\/\/[^.]{1,256}\.documents\.azure\.com:443\/;AccountKey=[^;]{1,1000};
        description: Azure CosmosDB Connection String
        enabled: true
        category: azure
        minlength: 70
        maxlength: 2048
        contextpenaltyany:
            - example
            - placeholder
            - sample
    azure_service_bus:
        regex: Endpoint=sb:\/\/[^.]{1,256}\.servicebus\.windows\.net\/;SharedAccessKeyName=[^;]{1,256};SharedAccessKey=[^;]{1,1000}
        description: Azure Service Bus Connection String
        enabled: true
        category: azure
        minlength: 60
        maxlength: 2048
        contextpenaltyany:
            - example
            - placeholder
            - sample
    azure_sql_connection:
        regex: Server=tcp:[^,]{1,256},1433;Initial Catalog=[^;]{1,256};Persist Security Info=False;User ID=[^;]{1,256};Password=[^;]{1,1000};
        description: Azure SQL Connection String
        enabled: true
        category: azure
        minlength: 50
        maxlength: 2048
        contextpenaltyany:
            - example
            - placeholder
            - sample
    basic_auth:
        regex: (?i)\b(Basic\s+[A-Za-z0-9+/]{20,100}={0,2})(?:[^A-Za-z0-9+/=]|$)
        description: HTTP Basic Authentication
        enabled: false
        category: auth
        minlength: 26
        maxlength: 108
        contextpenaltyany:
            - example
            - sample
            - usage
            - caption
            - documentation
            - test
            - '@example'
            - description
            - tutorial
            - unicode
            - Basic Multilingual
            - BMP
            - fromCharCode
            - createElement
            - <h1
            - <h2
            - <h3
            - <h4
            - <h5
            - <h6
            - Basic authorization
            - Basic authentication
            - Basic configuration
    bearer_token:
        regex: (?i)\b(bearer\s+[a-zA-Z0-9_.=-]{10,500})(?:[^A-Za-z0-9_.=-]|$)
        description: Bearer Token
        enabled: true
        category: auth
        minlength: 20
        contextpenaltyany:
            - QVO
            - QUO
            - YO
            - 'accessToken:'
            - .accessToken
            - oauth_token=
            - variable
            - config
            - credential
            - INVALID_ACCESS_TOKEN
            - MISSING_ACCESS_TOKEN
        useentropy: true
        minentropy: 3.6
        entropyminlength: 20
    braintree_token:
        regex: \b(access_token\$production\$[0-9a-z]{16}\$[0-9a-f]{32})(?:[^0-9A-Za-z_$]|$)
        description: Braintree Access Token
        enabled: true
        category: payment
        minlength: 73
        maxlength: 73
    config_api_key:
        regex: '[''"]?(?:api|app)(?:_|-|\.)?(?:key|token|secret)[''"]?\s*[:=]\s*[''"]([a-zA-Z0-9_\-\.]{8,256})[''"]'
        description: Configuration API Key
        enabled: true
        category: config
        minlength: 8
        maxlength: 256
        collisionpriority: -20
        useentropy: true
        minentropy: 3.5
        entropyminlength: 12
    config_secret:
        regex: '[''"]?(?:secret|private|auth)(?:_|-|\.)?(?:key|token)[''"]?\s*[:=]\s*[''"]([a-zA-Z0-9_\-\.]{8,256})[''"]'
        description: Configuration Secret
        enabled: true
        category: config
        minlength: 8
        maxlength: 256
        collisionpriority: -20
        useentropy: true
        minentropy: 3.5
        entropyminlength: 12
    credit_card_number:
        regex: (?i)(?:^|[^A-Za-z0-9])(?:card_?number|cc-number|credit_?card|pan|cc_num)\s*[:=]\s*['"]?(\b(?:\d[ -]*?){13,19}\b|\b\d{4}[ -]?\*{4}[ -]?\*{4}[ -]?\d{4}\b|\b\d{6}[ -]?\*{6}[ -]?\d{4}\b)['"]?
        description: Credit Card Number (PAN)
        enabled: true
        category: payment
        minlength: 13
        maxlength: 23
        contextboostany:
            - card
            - credit
            - cc
            - pan
        contextpenaltyany:
            - example
            - test
            - sample
            - placeholder
            - "1234"
            - XXXX
            - visa
            - mastercard
            - amex
            - dummy
            - fake
            - test_card
            - card-number-input
            - card-expiry-input
            - card-cvc-input
    digitalocean_access_token:
        regex: \b(dop_v1_[a-f0-9]{64})(?:[^A-Za-z0-9_-]|$)
        description: DigitalOcean Personal Access Token
        enabled: true
        category: cloud
        minlength: 71
        maxlength: 71
        collisionpriority: 20
        contextpenaltyany:
            - example
            - placeholder
            - sample
    digitalocean_oauth_token:
        regex: \b(doo_v1_[a-f0-9]{64})(?:[^A-Za-z0-9_-]|$)
        description: DigitalOcean OAuth Token
        enabled: true
        category: cloud
        minlength: 71
        maxlength: 71
        collisionpriority: 20
    digitalocean_refresh_token:
        regex: \b(dor_v1_[a-f0-9]{64})(?:[^A-Za-z0-9_-]|$)
