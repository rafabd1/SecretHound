        regex: \b((?:ghp|gho|ghu|ghr)_[A-Za-z0-9_]{36,251})(?:[^A-Za-z0-9_]|$)
        description: GitHub Personal, OAuth, User, or Refresh Token
        enabled: true
        category: code
        minlength: 40
        maxlength: 255
        collisionpriority: 10
        useentropy: true
        minentropy: 3.2
        entropyminlength: 36
        contextpenaltyany:
