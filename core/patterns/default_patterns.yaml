    generic_password:
        regex: (?i)(?:password|passwd|pwd|secret)\s*[=:]+\s*["']([^'"]{8,30})["']
        description: Generic Password
        enabled: false
        category: generic
        minlength: 8
        maxlength: 30
        contextpenaltyany:
            - match
            - valid
            - must
            - should
            - hint
            - help
            - message
            - error
            - Change password
            - Reset password
            - Forgot password
            - pseudo
            - selector
            - createElement
            - render
            - component
            - input[type
            - USERNAME
            - '[REDACTED]'
            - switch_to_
        useentropy: true
        minentropy: 3.3
        entropyminlength: 10
    github_fine_grained_token:
        regex: \b(github_pat_[0-9A-Za-z_]{82})(?:[^0-9A-Za-z_]|$)
        description: GitHub Fine-Grained Personal Access Token
        enabled: true
        category: code
        minlength: 93
        maxlength: 93
        collisionpriority: 20
        useentropy: true
        minentropy: 3.6
        entropyminlength: 50
